name: Apply site fixes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes and push branch
        run: |
          git checkout -b site-fixes
          bash .github/fixscript.sh
          git rm -q .github/fixscript.sh .github/workflows/apply-site-fixes.yml
          git config user.name "site-fixes-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Sitewide fixes: prijzen incl. BTW, WhatsApp-nummer, typos, encoding, footerlinks"
          git push origin site-fixes --force
