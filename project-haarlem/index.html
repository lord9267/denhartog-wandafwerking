<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Renovatie Project Haarlem | Den Hartog Wandafwerking</title>
<meta name="description" content="Bekijk ons renovatieproject in Haarlem. Professionele wandafwerking door Den Hartog.">
<link rel="icon" href="/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0d0d1a;color:#fff;line-height:1.6}
header{background:rgba(13,13,26,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.05);padding:1rem 2rem;position:fixed;width:100%;top:0;z-index:1000}
.header-content{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back-link{color:#60a5fa;text-decoration:none;font-size:0.9rem;transition:color 0.3s}
.back-link:hover{color:#a78bfa}
main{max-width:1200px;margin:0 auto;padding:6rem 2rem 4rem}
.project-hero{text-align:center;margin-bottom:3rem}
.project-hero h1{font-size:2.5rem;margin-bottom:0.5rem;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.project-meta{color:rgba(255,255,255,0.6);font-size:1rem;margin-bottom:1rem}
.project-description{max-width:700px;margin:0 auto;color:rgba(255,255,255,0.8);font-size:1.1rem;line-height:1.8}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;margin-top:2rem}
.gallery-item{border-radius:16px;overflow:hidden;aspect-ratio:4/3;position:relative}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
.gallery-item:hover img{transform:scale(1.05)}
footer{text-align:center;padding:2rem;color:rgba(255,255,255,0.4);font-size:0.85rem;border-top:1px solid rgba(255,255,255,0.05)}
@media(max-width:768px){.project-hero h1{font-size:1.8rem}.gallery-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="header-content">
<div class="logo">Den Hartog Wandafwerking</div>
<a href="/#projecten" class="back-link">&larr; Terug naar projecten</a>
</div>
</header>
<main>
<div class="project-hero">
<h1>Project Haarlem</h1>
<p class="project-meta">Haarlem, Noord-Holland &bull; Renovatie</p>
<p class="project-description">Professionele wandafwerking en renovatie in Haarlem. Vakkundig uitgevoerd door Den Hartog Wandafwerking.</p>
</div>
<div class="gallery-grid">
<div class="gallery-item"><img src="/project-haarlem/IMG_1231.jpeg" alt="Project Haarlem - Foto 1" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1232.jpeg" alt="Project Haarlem - Foto 2" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1233.jpeg" alt="Project Haarlem - Foto 3" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1234.jpeg" alt="Project Haarlem - Foto 4" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1235.jpeg" alt="Project Haarlem - Foto 5" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1236.jpeg" alt="Project Haarlem - Foto 6" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1237.jpeg" alt="Project Haarlem - Foto 7" loading="lazy"></div>
<div class="gallery-item"><img src="/project-haarlem/IMG_1238.jpeg" alt="Project Haarlem - Foto 8" loading="lazy"></div>
</div>
</main>
<footer>
<p>&copy; 2024 Den Hartog Wandafwerking. Alle rechten voorbehouden.</p>
</footer>
</body>
</html>
