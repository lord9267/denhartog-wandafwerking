<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Renovlies Project Luttelgeest | Den Hartog Wandafwerking</title>
    <meta name="description" content="Nieuwbouwproject in Luttelgeest door Den Hartog Wandafwerking. Complete wandafwerking met professioneel resultaat.">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0d0d1a;color:#fff;line-height:1.6}
        .hero{background:linear-gradient(135deg,#0d0d1a 0%,#1a1a3e 100%);padding:80px 20px 40px;text-align:center}
        .hero h1{font-size:2.5rem;margin-bottom:10px;background:linear-gradient(135deg,#c19b5f,#e8d5a3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero .location{color:#aaa;font-size:1.1rem;margin-bottom:8px}
        .hero .description{color:#ccc;max-width:700px;margin:0 auto;font-size:1.05rem}
        .back-link{display:inline-block;margin:20px;padding:10px 20px;color:#c19b5f;text-decoration:none;border:1px solid #c19b5f;border-radius:25px;transition:all .3s}
        .back-link:hover{background:#c19b5f;color:#0d0d1a}
        .gallery{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
        .gallery-item{border-radius:12px;overflow:hidden;aspect-ratio:4/3}
        .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
        .gallery-item img:hover{transform:scale(1.03)}
        .footer{text-align:center;padding:40px 20px;color:#666;font-size:.9rem;border-top:1px solid #1a1a3e;margin-top:40px}
        .footer a{color:#c19b5f;text-decoration:none}
        @media(max-width:600px){.hero h1{font-size:1.8rem}.gallery{grid-template-columns:1fr;padding:10px}}
    </style>
</head>
<body>
    <a href="/#projecten" class="back-link">&larr; Terug naar projecten</a>
    <section class="hero">
        <h1>Nieuwbouw Luttelgeest</h1>
        <p class="location">Luttelgeest, Flevoland</p>
        <p class="description">Complete wandafwerking voor een nieuwbouwproject in Luttelgeest. Professioneel resultaat met oog voor detail en kwaliteit.</p>
    </section>
    <section class="gallery">
            <div class="gallery-item"><img src="/project-luttelgeest/IMG_1006.jpeg" alt="Hal met trap en strakke witte muren na renovlies afwerking nieuwbouw Luttelgeest Flevoland" loading="lazy"></div>
            <div class="gallery-item"><img src="/project-luttelgeest/IMG_1008.jpeg" alt="Trapopgang met professioneel schilderwerk en wandafwerking nieuwbouw Luttelgeest" loading="lazy"></div>
            <div class="gallery-item"><img src="/project-luttelgeest/IMG_1009.jpeg" alt="Overloop en traphal met strak wit geschilderde wanden nieuwbouw project Luttelgeest Flevoland" loading="lazy"></div>
    </section>
    <footer class="footer">
        <p>&copy; 2024 <a href="/">Den Hartog Wandafwerking</a> | Renovlies & Behangen Specialist</p>
    </footer>
</body>
</html>
